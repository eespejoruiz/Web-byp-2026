# Formulario previo a WhatsApp (3-nov-2026): limite por visitante para
# /api/whatsapp-lead. La IP real llega de Cloudflare en CF-Connecting-IP; aqui
# $remote_addr seria la de Traefik, la misma para todos.
limit_req_zone $http_cf_connecting_ip zone=byp_wa_lead:1m rate=10r/m;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/html text/plain application/xml;

  # Las rutas /industria/<x> son duplicados historicos de /industrias/<x>:
  # renderizan exactamente el mismo componente. Mientras el HTML estaba vacio
  # daba igual; ahora que cada pagina es rastreable, dos direcciones con el
  # mismo contenido compiten entre si. Se redirigen de forma permanente.
  location ~ ^/industria/(.+)$ {
    return 301 /industrias/$1;
  }
  location = /industria {
    return 301 /industrias;
  }

  # Direcciones del WordPress anterior que Google todavia tiene indexadas o
  # conoce por el sitemap viejo (wp-sitemap.xml del 23-sep-2026). Cada una va a
  # su equivalente actual para no perder lo que ya habia ganado.
  location ~ ^/panaderia-pasteleria/?$   { return 301 /industrias/panaderia; }
  location ~ ^/chocolateria-heladeria/?$ { return 301 /equipos/chocolate; }
  location ~ ^/whatsapp-accounts(/.*)?$  { return 301 /contacto; }
  location ~ ^/sample-page/?$            { return 301 /; }
  location ~ ^/author(/.*)?$             { return 301 /; }
  location ~ ^/wp-sitemap.*\.xml$        { return 301 /sitemap.xml; }

  # Una sola direccion por pagina. Todas las rutas respondian 200 con y sin
  # barra final; el canonical lo resolvia, pero Google rastreaba las dos.
  # La version con barra redirige a la version sin barra (la del sitemap).
  # "/" no entra: la expresion exige al menos un caracter antes de la barra.
  location ~ ^(.+)/$ {
    return 301 $1$is_args$args;
  }

  # Datos del formulario previo a WhatsApp -> Selva Boost (formulario
  # «byp-tech-antes-de-whatsapp» de ByP Tech). La API de Boost no acepta llamadas
  # del navegador desde otro dominio (CORS), asi que el navegador llama aqui y nginx
  # reenvia. Solo POST, solo ese formulario, cuerpo chico y limite por visitante.
  # Con el resolver y la variable, nginx no necesita DNS para arrancar: si la API no
  # resuelve, falla esta llamada y el sitio sigue arriba (WhatsApp se abre igual).
  location = /api/whatsapp-lead {
    limit_except POST { deny all; }
    limit_req zone=byp_wa_lead burst=5 nodelay;
    limit_req_status 429;
    client_max_body_size 16k;
    resolver 1.1.1.1 8.8.4.4 valid=300s ipv6=off;
    resolver_timeout 5s;
    set $boost_api https://api-saas.selvagencia.com;
    proxy_pass $boost_api/api/v1/public/forms/byp-tech-antes-de-whatsapp/submit;
    proxy_ssl_server_name on;
    proxy_http_version 1.1;
    proxy_set_header Host api-saas.selvagencia.com;
    proxy_set_header X-Real-IP $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
    proxy_set_header Origin "";
    proxy_set_header Cookie "";
    proxy_set_header Connection "";
    proxy_hide_header Set-Cookie;
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;
    add_header Cache-Control "no-store" always;
  }

  location ~* \.(js|css|webp|png|jpg|svg|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # El sitio esta prerenderizado: cada ruta tiene su propio index.html en disco.
  # Sin el antiguo "$uri/": con la redireccion de la barra final de arriba, una
  # carpeta sin index.html (p. ej. /static) entraria en un bucle de 301.
  location / {
    try_files $uri $uri/index.html =404;
  }

  # Una direccion que no existe devuelve 404 de verdad, con la pagina de error
  # del sitio. Antes devolvia 200 con la portada, que para Google es una pagina
  # rota disfrazada de pagina buena.
  error_page 404 /404.html;
  location = /404.html {
    internal;
  }

  # Detras de Cloudflare y Traefik, una redireccion absoluta saldria apuntando
  # al host interno del contenedor.
  absolute_redirect off;

  add_header X-Content-Type-Options nosniff;
  add_header X-Frame-Options SAMEORIGIN;
  add_header Referrer-Policy strict-origin-when-cross-origin;
}
