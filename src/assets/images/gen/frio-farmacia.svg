<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" role="img" aria-label="Dibujo técnico de un refrigerador de farmacia con puerta de vidrio">
  <defs>
    <pattern id="rejilla" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M10 0H0V10" fill="none" stroke="#e4e9ee" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="400" height="320" fill="url(#rejilla)"/>
  <!-- cotas -->
  <g stroke="#5b6773" stroke-width="1" fill="none">
    <path d="M136 306H264M136 300V312M264 300V312"/>
    <path d="M288 18V288M282 18H294M282 288H294"/>
  </g>
