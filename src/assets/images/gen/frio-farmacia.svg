    <rect x="204" y="96" width="34" height="16" rx="2"/>
    <rect x="158" y="140" width="38" height="20" rx="2"/>
    <rect x="202" y="142" width="9" height="18" rx="2"/><rect x="215" y="142" width="9" height="18" rx="2"/><rect x="228" y="142" width="9" height="18" rx="2"/>
    <rect x="160" y="190" width="9" height="18" rx="2"/><rect x="173" y="190" width="9" height="18" rx="2"/>
    <rect x="190" y="188" width="46" height="20" rx="2"/>
    <rect x="158" y="234" width="34" height="18" rx="2"/>
    <rect x="200" y="234" width="38" height="18" rx="2"/>
